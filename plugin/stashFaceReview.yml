name: Stash Face Recognition
description: Automatic face recognition, six-frame video indexing, clustering and Performer assignment (Immich-style).
version: 1.0.0
url: https://github.com/fbsis/stash-face
exec:
  - python3
  - "{pluginDir}/stash_face_review.py"
interface: raw
errLog: info
tasks:
  - name: Test Remote Connection
    defaultArgs:
      action: health
  - name: Index Photos & Videos (6 Frames per Video)
    defaultArgs:
      action: scan
  - name: Auto-tag Content from File Paths
    defaultArgs:
      action: auto_tag
  - name: Re-cluster Faces (DBSCAN)
    defaultArgs:
      action: cluster
  - name: Sync Performers from Stash
    defaultArgs:
      action: sync_performers
hooks:
  - name: Auto-Recognize Created or Updated Image
    triggeredBy:
      - Image.Create.Post
      - Image.Update.Post
    defaultArgs:
      action: image
  - name: Forget Deleted Image
    triggeredBy:
      - Image.Destroy.Post
    defaultArgs:
      action: forget
