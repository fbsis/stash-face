[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "stash-face"
version = "0.1.0"
description = "Face detection and human-reviewed Performer assignments for Stash"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1",
  "httpx>=0.27,<1", "pillow>=11,<13", "numpy>=1.26,<3",
  "opencv-python-headless>=4.10,<5", "insightface>=0.7,<3",
  "onnxruntime>=1.16,<2", "scikit-learn>=1.4,<2",
]

[project.optional-dependencies]
intel = ["openvino>=2025,<2027"]
test = ["pytest>=8,<10", "graphql-core>=3.2,<4", "pyyaml>=6,<7", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
include = ["stash_face*"]

[tool.setuptools.package-data]
stash_face = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a running local Postman Stash simulation"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
